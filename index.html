<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section</title>
  
  <!-- Preload fonts for rapid switching without delay -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Courier+Prime:wght@700&family=Inter:wght@900&family=Pacifico&family=Playfair+Display:wght@900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero-container {
      text-align: center;
      padding: 2rem;
      max-width: 1200px;
    }

    .hero-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      color: #1a1a1a;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 2.5rem;
      white-space: nowrap;
    }

    /* 1. "Change" - Font cycling without layout shift */
    #change-word {
      display: inline-block;
      text-align: center;
      min-width: 4.2ch; /* Prevents adjacent words from shifting */
      vertical-align: baseline;
    }

    /* 2. "Style" - Rapid color cycling */
    #style-word {
      display: inline-block;
      animation: colorCycle 0.3s infinite linear;
    }

    @keyframes colorCycle {
      0%   { color: #e63946; }
      20%  { color: #2a9d8f; }
      40%  { color: #e76f51; }
      60%  { color: #9b5de5; }
      80%  { color: #f15bb5; }
      100% { color: #00bbf9; }
    }

    /* 3. "That" - Vibrating motion effect */
    #that-word {
      display: inline-block;
      animation: vibrate 0.1s infinite linear;
    }

    @keyframes vibrate {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-2px, 1.5px); }
      40%  { transform: translate(-1.5px, -2px); }
      60%  { transform: translate(2px, 1px); }
      80%  { transform: translate(1.5px, -1.5px); }
      100% { transform: translate(0, 0); }
    }

    /* Button Group */
    .button-group {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      align-items: center;
    }

    .btn {
      background: #ffffff;
      border: 1.5px solid #1a1a1a;
      border-radius: 50px;
      padding: 0.65rem 2.25rem;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #1a1a1a;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      background-color: #f5f5f5;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <main class="hero-container">
    <h1 class="hero-title">
      We <span id="change-word">Change</span> <span id="style-word">Style</span> Just Like <span id="that-word">That</span>
    </h1>

    <div class="button-group">
      <button class="btn">Cool</button>
      <button class="btn">Classic</button>
      <button class="btn">Professional</button>
    </div>
  </main>

  <script>
    // Rapid font changing for "Change"
    const fonts = [
      "'Inter', sans-serif",
      "'Playfair Display', serif",
      "'Courier Prime', monospace",
      "'Pacifico', cursive",
      "'Cinzel', serif",
      "'Space Grotesk', sans-serif"
    ];

    const changeElement = document.getElementById('change-word');
    let currentFontIndex = 0;

    setInterval(() => {
      currentFontIndex = (currentFontIndex + 1) % fonts.length;
      changeElement.style.fontFamily = fonts[currentFontIndex];
    }, 180);
  </script>

</body>
</html>
