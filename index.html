<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrison Awning</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;800;900&display=swap" rel="stylesheet">

  <!-- Model Viewer Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* -------------------------------------------------------------
       1. GLOBAL RESET
    ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* -------------------------------------------------------------
       2. NAVIGATION
    ------------------------------------------------------------- */
    .navbar {
      width: 100%;
      padding: 35px 20px 20px;
      display: flex;
      justify-content: center;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: #555555;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #000000;
    }

    /* -------------------------------------------------------------
       3. HERO SECTION GRID LAYOUT
    ------------------------------------------------------------- */
    .hero-section {
      max-width: 1250px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px 60px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 30px;
      flex: 1;
    }

    /* Left Column (Typography & 3D Character) */
    .hero-left {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .title-wrapper {
      display: flex;
      flex-direction: column;
    }

    .title-solid {
      font-size: clamp(3.8rem, 7vw, 7rem);
      font-weight: 900;
      color: #1e2229;
      line-height: 0.92;
      letter-spacing: -2px;
    }

    .title-outline {
      font-size: clamp(3.8rem, 7vw, 7rem);
      font-weight: 900;
      color: transparent;
      -webkit-text-stroke: 2.5px #1e2229;
      line-height: 0.92;
      letter-spacing: -1px;
    }

    /* 3D Character Box - Positioned at lower right of Awning text */
    .character-box {
      width: 150px;
      height: 220px;
      align-self: flex-end;
      margin-top: -90px;
      margin-right: 20px;
      position: relative;
      z-index: 5;
      pointer-events: none; /* Disables click/drag interrupts */
    }

    /* Hides the default loading progress bar entirely */
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: transparent;
      --progress-bar-height: 0px;
      background: transparent;
      filter: sepia(0.8) hue-rotate(25deg) saturate(1.8) brightness(1.05);
    }

    model-viewer::part(default-progress-bar) {
      display: none;
    }

    /* Right Column (Visual Card & House Image) */
    .hero-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      position: relative;
    }

    .olive-card {
      background-color: #BAB86C;
      width: 88%;
      aspect-ratio: 1 / 0.95;
      border-radius: 4px;
      position: relative;
    }

    .house-image {
      position: absolute;
      width: 115%;
      height: auto;
      left: -20%;
      bottom: 6%;
      border-radius: 2px;
      box-shadow: 0px 20px 30px rgba(0, 0, 0, 0.12);
    }

    /* Carousel Dots */
    .carousel-dots {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      margin-right: 38%;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #e0e0e0;
    }

    .dot.active {
      background-color: #BAB86C;
    }

    /* -------------------------------------------------------------
       4. RESPONSIVE BREAKPOINTS
    ------------------------------------------------------------- */
    @media (max-width: 900px) {
      .hero-section {
        grid-template-columns: 1fr;
        gap: 50px;
        text-align: center;
      }

      .hero-left {
        align-items: center;
      }

      .character-box {
        align-self: center;
        margin-top: 10px;
        margin-right: 0;
      }

      .hero-right {
        align-items: center;
      }

      .olive-card {
        width: 100%;
      }

      .house-image {
        width: 100%;
        left: 0;
        bottom: 0;
        position: relative;
      }

      .carousel-dots {
        margin-right: 0;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="#about">About Us</a></li>
      <li><a href="#products">Products</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#projects">Projects</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <main class="hero-section">
    
    <!-- Left Column: Typography & 3D Character -->
    <div class="hero-left">
      <div class="title-wrapper">
        <h1 class="title-solid">Morrison</h1>
        <h1 class="title-outline">Awning</h1>
      </div>

      <!-- 3D Walking Character (Rotated to face right towards house) -->
      <div class="character-box">
        <model-viewer 
          id="hero-character"
          src="assets/UAL1_Standard.glb" 
          autoplay 
          loop 
          interaction-prompt="none"
          camera-orbit="-140deg 75deg 105%" 
          shadow-intensity="0">
        </model-viewer>
      </div>
    </div>

    <!-- Right Column: Card & Image -->
    <div class="hero-right">
      <div class="olive-card">
        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80" alt="Modern Architecture Awning" class="house-image">
      </div>
      
      <div class="carousel-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot active"></span>
      </div>
    </div>

  </main>

  <!-- Script: Auto-Detect Walking Animation & Set #BAB86C Color -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const viewer = document.querySelector('#hero-character');

      viewer.addEventListener('load', () => {
        // Play active walking clip
        const animations = viewer.availableAnimations;
        if (animations && animations.length > 0) {
          const walkClip = animations.find(a => a.toLowerCase().includes('walk')) ||
                           animations.find(a => a.toLowerCase().includes('run')) ||
                           animations[0];
          viewer.animationName = walkClip;
          viewer.play();
        }

        // Force #BAB86C color directly onto materials
        try {
          const oliveColor = [0.73, 0.72, 0.42, 1.0];
          viewer.model.materials.forEach((material) => {
            if (material.pbrMetallicRoughness) {
              material.pbrMetallicRoughness.setBaseColorFactor(oliveColor);
            }
          });
        } catch (e) {
          // Handled via CSS fallback
        }
      });
    });
  </script>

</body>
</html>
