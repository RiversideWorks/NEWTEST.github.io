<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV & Heat Protection Simulator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #1e2025;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Card Container */
    .simulator-card {
      background: #2B2D33;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      max-width: 950px;
      width: 100%;
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    /* Left Visual Stage */
    .climate-stage {
      position: relative;
      background: linear-gradient(180deg, #d97736 0%, #362319 100%);
      border-radius: 16px;
      height: 320px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.5s ease;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .climate-stage.shaded {
      background: linear-gradient(180deg, #4a5d4e 0%, #1c261e 100%);
    }

    .badge {
      display: inline-block;
      align-self: flex-start;
      padding: 6px 14px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
      color: #fff;
    }

    .temp-readout {
      font-size: 4.5rem;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      transition: color 0.3s ease;
    }

    .temp-readout span {
      font-size: 1.8rem;
      vertical-align: super;
      color: #BAB86C;
    }

    .status-text {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f1f1;
    }

    /* Right Controls */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .feature-title {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.15;
    }

    .feature-title span {
      color: #BAB86C;
    }

    .feature-desc {
      font-size: 0.95rem;
      color: #b0b3bc;
      line-height: 1.6;
    }

    /* Custom Slider */
    .slider-stage {
      background: #212328;
      padding: 20px 24px;
      border-radius: 14px;
      position: relative;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 800;
      color: #BAB86C;
    }

    .shade-slider {
      width: 65%;
      accent-color: #BAB86C;
      cursor: pointer;
      height: 6px;
    }

    /* Character Overlay */
    .character-container {
      width: 120px;
      height: 200px;
      position: absolute;
      right: 10px;
      bottom: -15px;
      pointer-events: none;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: transparent;
      background: transparent;
    }

    model-viewer::part(default-progress-bar) { display: none; }

    @media (max-width: 768px) {
      .simulator-card {
        grid-template-columns: 1fr;
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="simulator-card">
    
    <!-- Left: Climate Simulation Screen -->
    <div class="climate-stage" id="climateStage">
      <div class="badge" id="statusBadge">Unprotected Surface</div>
      <div>
        <div class="temp-readout" id="tempDisplay">38<span>°C</span></div>
        <p class="status-text" id="statusText">Direct Solar Radiation & High UV</p>
      </div>
    </div>

    <!-- Right: Interactive Slider & Character Inspector -->
    <div class="controls-wrapper">
      <h2 class="feature-title">Thermal <span>Comfort</span> Shield</h2>
      <p class="feature-desc">Block up to 98% of harmful UV rays and drastically reduce patio temperatures with high-density fabric weaves.</p>

      <div class="slider-stage">
        <div class="slider-label">
          <span>SHADE COVERAGE</span>
          <span id="percentText">0%</span>
        </div>

        <input type="range" min="0" max="100" value="0" class="shade-slider" id="shadeSlider">

        <!-- Character acts as the Inspector pointing out data -->
        <div class="character-container">
          <model-viewer 
            id="inspectorChar"
            src="assets/UAL1_Standard.glb" 
            autoplay 
            loop 
            interaction-prompt="none"
            camera-orbit="-20deg 75deg 85%"
            camera-target="0m 0.9m 0m"
            exposure="1.2">
          </model-viewer>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const slider = document.getElementById('shadeSlider');
      const climateStage = document.getElementById('climateStage');
      const tempDisplay = document.getElementById('tempDisplay');
      const percentText = document.getElementById('percentText');
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const character = document.getElementById('inspectorChar');

      let validIdleClip = null;
      let validGestureClip = null;
      let gestureTimeout = null;

      const primaryColor = [0.169, 0.176, 0.200, 1.0];
      const secondaryColor = [0.73, 0.72, 0.42, 1.0];

      character.addEventListener('load', () => {
        // Material tinting
        if (character.model && character.model.materials) {
          character.model.materials.forEach((mat, idx) => {
            if (mat.pbrMetallicRoughness) {
              mat.pbrMetallicRoughness.setRoughnessFactor(0.5);
              mat.pbrMetallicRoughness.setMetallicFactor(0.0);
              mat.pbrMetallicRoughness.setBaseColorFactor(idx === 0 ? primaryColor : secondaryColor);
            }
          });
        }

        // Dynamically extract animation clips
        const available = character.availableAnimations || [];
        validIdleClip = available.find(c => /idle|stand|talk/i.test(c)) || available[0];
        validGestureClip = available.find(c => /point|wave|interact|walk/i.test(c)) || available[1] || validIdleClip;

        if (validIdleClip) {
          character.animationName = validIdleClip;
          character.play();
        }
      });

      // Interactive Slider Event
      slider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        percentText.textContent = `${val}%`;

        // Calculate Temperature (38°C down to 21°C)
        const temp = Math.round(38 - (val * 0.17));
        tempDisplay.innerHTML = `${temp}<span>°C</span>`;

        // Visual State Changes
        if (val > 50) {
          climateStage.classList.add('shaded');
          statusBadge.textContent = 'Morrison Canopy Active';
          statusText.textContent = 'Cool Ambient Shade & 98% UV Blocked';
        } else {
          climateStage.classList.remove('shaded');
          statusBadge.textContent = 'Unprotected Surface';
          statusText.textContent = 'Direct Solar Radiation & High UV';
        }

        // Trigger character gesture while dragging
        if (validGestureClip && character.animationName !== validGestureClip) {
          character.animationName = validGestureClip;
          character.play();
        }

        // Reset back to continuous standing idle when user stops sliding
        clearTimeout(gestureTimeout);
        gestureTimeout = setTimeout(() => {
          if (validIdleClip) {
            character.animationName = validIdleClip;
            character.play();
          }
        }, 800);
      });
    });
  </script>

</body>
</html>
