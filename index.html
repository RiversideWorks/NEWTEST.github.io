<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrison Awning - Hero Section</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;800;900&display=swap" rel="stylesheet">

  <!-- Model Viewer Script -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* -------------------------------------------------------------
       1. GLOBAL & RESET STYLES
    ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* -------------------------------------------------------------
       2. NAVIGATION BAR
    ------------------------------------------------------------- */
    .navbar {
      width: 100%;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: #555555;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #000000;
    }

    /* -------------------------------------------------------------
       3. HERO SECTION LAYOUT
    ------------------------------------------------------------- */
    .hero-section {
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 60px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 20px;
      position: relative;
      flex: 1;
    }

    /* --- Left Column: Typography --- */
    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-title {
      font-size: clamp(3.8rem, 8vw, 7.5rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -2px;
      text-transform: none;
    }

    .text-solid {
      display: block;
      color: #22252a;
    }

    .text-outline {
      display: block;
      color: transparent;
      -webkit-text-stroke: 2.5px #22252a;
    }

    /* --- 3D Character Positioning --- */
    .character-container {
      position: absolute;
      right: 15%;
      bottom: -40px;
      width: 180px;
      height: 240px;
      pointer-events: none; /* Disables drag/click interaction */
      z-index: 5;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      background: transparent;
    }

    /* --- Right Column: Visual Card --- */
    .hero-visual {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .olive-card {
      background-color: #BAB86C; /* Olive Green Accent */
      width: 90%;
      aspect-ratio: 1 / 0.95;
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .house-image {
      position: absolute;
      width: 115%;
      height: auto;
      left: -20%;
      bottom: 5%;
      object-fit: contain;
      filter: drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.08));
    }

    /* --- Carousel Indicators --- */
    .carousel-dots {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      margin-right: 40%;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #d1d1d1;
    }

    .dot.active {
      background-color: #BAB86C;
    }

    /* -------------------------------------------------------------
       4. RESPONSIVE BREAKPOINTS
    ------------------------------------------------------------- */
    @media (max-width: 992px) {
      .hero-section {
        grid-template-columns: 1fr;
        gap: 60px;
        text-align: center;
      }

      .hero-visual {
        align-items: center;
      }

      .olive-card {
        width: 80%;
      }

      .house-image {
        width: 110%;
        left: -5%;
      }

      .character-container {
        right: 50%;
        transform: translateX(50%);
        bottom: -70px;
        width: 150px;
        height: 200px;
      }

      .carousel-dots {
        margin-right: 0;
        justify-content: center;
      }
    }

    @media (max-width: 576px) {
      .nav-links {
        gap: 16px;
        font-size: 13px;
      }

      .text-outline {
        -webkit-text-stroke: 1.5px #22252a;
      }

      .olive-card {
        width: 100%;
      }

      .character-container {
        width: 120px;
        height: 160px;
        bottom: -50px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="#about">About Us</a></li>
      <li><a href="#products">Products</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#projects">Projects</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <main class="hero-section">
    
    <!-- Left Typography Section -->
    <div class="hero-content">
      <h1 class="hero-title">
        <span class="text-solid">Morrison</span>
        <span class="text-outline">Awning</span>
      </h1>

      <!-- 3D Walking Character -->
      <div class="character-container">
        <model-viewer 
          id="hero-character"
          src="assets/UAL1_Standard.glb" 
          animation-name="Walk_loop" 
          autoplay 
          loop 
          interaction-prompt="none"
          camera-orbit="-90deg 75deg 100%" 
          shadow-intensity="0">
        </model-viewer>
      </div>
    </div>

    <!-- Right Visual Section -->
    <div class="hero-visual">
      <div class="olive-card">
        <!-- Rendered House Asset -->
        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80" alt="Modern Architecture Awning" class="house-image">
      </div>
      
      <!-- Pagination Dots -->
      <div class="carousel-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot active"></span>
      </div>
    </div>

  </main>

  <!-- Script to apply #BAB86C Color to 3D Model -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const modelViewer = document.querySelector('#hero-character');

      modelViewer.addEventListener('load', () => {
        // Convert #BAB86C hex color to normalized RGB floats (0 to 1 scale)
        // Red: 186/255 = 0.729 | Green: 184/255 = 0.721 | Blue: 108/255 = 0.423
        const targetColor = [0.729, 0.721, 0.423, 1.0];

        // Apply custom color factor across all character materials
        modelViewer.model.materials.forEach((material) => {
          if (material.pbrMetallicRoughness) {
            material.pbrMetallicRoughness.setBaseColorFactor(targetColor);
          }
        });
      });
    });
  </script>

</body>
</html>
