<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-Out Interactive Cutout Cards</title>
    <style>
        /* =========================================
           1. RESET & FLAT BACKDROP
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ededef;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header p {
            font-size: 0.95rem;
            color: #222;
            font-weight: 500;
            line-height: 1.4;
        }

        .header .arrow {
            display: block;
            margin-top: 6px;
            font-size: 1.1rem;
            color: #444;
        }

        /* =========================================
           2. CARDS CONTAINER & FRAME BASE
           ========================================= */
        .cards-container {
            display: flex;
            gap: 24px;
            justify-content: center;
            align-items: flex-end;
            max-width: 860px;
            width: 100%;
        }

        .card-wrapper {
            flex: 1;
            max-width: 380px;
        }

        .card {
            position: relative;
            background-color: #e2e2e5; /* Base default frame color */
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            padding: 12px;
            cursor: pointer;
            overflow: visible; /* Allows cutout to break top boundary */
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.4s ease, 
                        background 0.4s ease, 
                        color 0.4s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        /* Gradient Frame Overlays for Card 1 & Card 2 */
        .card-1::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 50%, #ec4899 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
        }

        .card-2::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: linear-gradient(135deg, #eab308 0%, #f97316 50%, #10b981 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
        }

        /* Desktop Cursor Spotlight */
        .card-glow {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 2;
        }

        @media (min-width: 721px) {
            .card-1 .card-glow {
                background: radial-gradient(circle 220px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.65) 0%, rgba(168, 85, 247, 0.45) 45%, rgba(236, 72, 153, 0.25) 70%, transparent 100%);
            }
            .card-2 .card-glow {
                background: radial-gradient(circle 220px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(250, 204, 21, 0.7) 0%, rgba(249, 115, 22, 0.5) 45%, rgba(16, 185, 129, 0.25) 70%, transparent 100%);
            }
            .card:hover {
                transform: translateY(-14px);
                box-shadow: 0 22px 42px rgba(0, 0, 0, 0.12);
            }
            .card:hover .card-glow {
                opacity: 1;
            }
            .card:hover .cutout-layer {
                transform: translateY(-32px) scale(1.12);
                filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.28));
            }
        }

        /* =========================================
           3. STAGE & POP-OUT CUTOUT
           ========================================= */
        .card-image-stage {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 14px;
            overflow: visible;
            z-index: 3;
        }

        /* Background Layer (Sky/Ocean Image) */
        .bg-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            overflow: hidden;
            z-index: 3;
        }

        .bg-layer svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Cutout Layer (Pops Straight Up out of Top Border) */
        .cutout-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            transform: translateY(0) scale(1);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s ease;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.15));
        }

        .cutout-layer svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Typography Inside Frame */
        .card-body {
            position: relative;
            z-index: 5;
            padding: 14px 6px 6px 6px;
            transition: color 0.4s ease;
        }

        .card-body h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
            transition: color 0.4s ease;
        }

        .card-body p {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.35;
            transition: color 0.4s ease;
        }

        /* =========================================
           4. MOBILE SCROLL TRIGGERED POP-UP & GRADIENT
           ========================================= */
        @media (max-width: 720px) {
            .cards-container {
                flex-direction: column;
                align-items: center;
                gap: 60px;
            }

            .card-wrapper {
                width: 100%;
            }

            /* Active class applied by Intersection Observer on mobile scroll */
            .card.scroll-active {
                transform: translateY(-16px);
                box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
            }

            /* Fill card outer frame background with gradient */
            .card.scroll-active::before {
                opacity: 1;
            }

            /* Make text white for ultra contrast against active gradient frame */
            .card.scroll-active .card-body h3,
            .card.scroll-active .card-body p {
                color: #ffffff;
            }

            /* Pop elements out on scroll */
            .card.scroll-active .cutout-layer {
                transform: translateY(-34px) scale(1.12);
                filter: drop-shadow(0 20px 26px rgba(0, 0, 0, 0.32));
            }
        }
    </style>
</head>

    <!-- INTERACTION SCRIPT -->
    <script>
        const cards = document.querySelectorAll('.card');

        // 1. Desktop Cursor Spotlight Tracking
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                if (window.innerWidth > 720) {
                    const rect = card.getBoundingClientRect();
                    const mouseXPercent = ((e.clientX - rect.left) / rect.width) * 100;
                    const mouseYPercent = ((e.clientY - rect.top) / rect.height) * 100;
                    
                    card.style.setProperty('--mouse-x', `${mouseXPercent}%`);
                    card.style.setProperty('--mouse-y', `${mouseYPercent}%`);
                }
            });
        });

        // 2. Mobile Intersection Observer (Triggers pop-up and gradient fill on scroll)
        const observerOptions = {
            root: null,
            rootMargin: '-15% 0px -15% 0px', // Triggers when card enters middle 70% of screen
            threshold: 0.5
        };

        const mobileObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (window.innerWidth <= 720) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('scroll-active');
                    } else {
                        entry.target.classList.remove('scroll-active');
                    }
                }
            });
        }, observerOptions);

        cards.forEach(card => mobileObserver.observe(card));
    </script>

    *, *::before, *::after {

    body {
      width: 100%;

      padding: 16px;
    }

    /* -------------------------------------------------------------
       2. LIST CONTAINER & ACTION BUTTON
    ------------------------------------------------------------- */
    .list-container {
      position: relative;
    }

    .more-button {
      background-color: #5c67ff;
      box-shadow: 0px 0px 0px 4px rgba(92, 103, 255, 0.3);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s ease-in;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      position: relative;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;

    .more-button:hover, 
    .more-button:focus-visible {
      box-shadow: 0px 0px 0px 8px rgba(92, 103, 255, 0.3);
      background-color: #4854ff;
    }

    .more-button:focus-visible {
      outline: 2px solid #1c3991;
      outline-offset: 4px;
    }

    /* Hamburger Line Transforms */
    .menu-icon-wrapper {
      border-radius: 2px;
      width: 20px;
      height: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 330ms ease-out;
    }

    .menu-icon-line {
      background-color: #fff;
      border-radius: 2px;
      width: 100%;
      height: 2px;
    }

    .menu-icon-line.half {
      width: 50%;
    }

    .menu-icon-line.first {
      transition: transform 300ms cubic-bezier(0.52, -0.8, 0.52, 0.52);
      transform-origin: right;
    }

    .menu-icon-line.last {
      align-self: flex-end;
      transition: transform 300ms cubic-bezier(0.52, -0.8, 0.52, 0.52);
      transform-origin: left;
    }

    /* -------------------------------------------------------------
       3. DROPDOWN MENU & ANIMATIONS
    ------------------------------------------------------------- */
    .more-button-list {
      background-color: #fff;
      border-radius: 12px;
      list-style-type: none;
      width: 150px;
      box-shadow: 0px 10px 25px rgba(28, 57, 145, 0.15);

      position: absolute;
      right: 0;
      top: 60px; /* Positioned directly below button for responsive safety */
      opacity: 0;
      visibility: hidden;
      transform: scale(0.8);
      transform-origin: top right;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
      z-index: 9;
    }

    .more-button-list-item {
      display: flex;
      align-items: center;
      color: #1c3991;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: background-color 0.2s ease, color 0.2s ease;
      opacity: 0;
      transform: translateX(-10px);
    }

    .more-button-list-item:hover {
      color: #5c67ff;
      background-color: rgba(132, 160, 244, 0.1);
    }

    .more-button-list-item:after {
      content: "";
      position: absolute;
      height: 1px;
      width: calc(100% - 24px);
      left: 12px;
      bottom: 0;
      background-color: rgba(132, 160, 244, 0.15);
    }

    .more-button-list-item:last-child:after {
      display: none;
    }

    .more-button-list-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .more-button-list-item span {
      display: inline-block;
      line-height: 20px;
      font-size: 14px;
      font-weight: 500;
      margin-left: 10px;
    }

    /* Active State Animations */
    .list-container.active .more-button-list {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .list-container.active .more-button {
      animation: onePulse 0.6s forwards linear;
    }

    .list-container.active .menu-icon-wrapper {
      transform: rotate(-45deg);
    }

    .list-container.active .menu-icon-line.first {
      transform: rotate(-90deg) translateX(1px);
    }

    .list-container.active .menu-icon-line.last {
      transform: rotate(-90deg) translateX(-1px);
    }

    .list-container.active .more-button-list-item {
      animation: fadeInItem 0.4s forwards ease-out;
    }

    .list-container.active .more-button-list-item:nth-child(1) { animation-delay: 0.1s; }
    .list-container.active .more-button-list-item:nth-child(2) { animation-delay: 0.2s; }
    .list-container.active .more-button-list-item:nth-child(3) { animation-delay: 0.3s; }
    .list-container.active .more-button-list-item:nth-child(4) { animation-delay: 0.4s; }

    @keyframes onePulse {
      0% { box-shadow: 0px 0px 0px 0px rgba(92, 103, 255, 0.3); }
      50% { box-shadow: 0px 0px 0px 12px rgba(92, 103, 255, 0.1); }
      100% { box-shadow: 0px 0px 0px 4px rgba(92, 103, 255, 0.3); }
    }

    @keyframes fadeInItem {
      to {
        transform: translateX(0px);
        opacity: 1;
      }
    }

    /* -------------------------------------------------------------
       4. FOOTER & SOCIAL LINKS
    ------------------------------------------------------------- */
    .socials {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 5;
    }

    .social-link {
      color: #fff;

      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social-link:hover,
    .social-link:focus-visible {
      background-color: #fff;
      color: #5c67ff;
      transform: translateY(-2px);
    }

    /* -------------------------------------------------------------
       5. RESPONSIVE BREAKPOINTS
    ------------------------------------------------------------- */
    @media (max-width: 480px) {
      .more-button-list {
        right: 50%;
        transform-origin: top center;
        transform: translateX(50%) scale(0.8);
      }

      .list-container.active .more-button-list {
        transform: translateX(50%) scale(1);
      }

      .socials {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
      }
    }
  </style>

  <!-- JavaScript Integration -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const listContainer = document.querySelector('.list-container');
      const moreButton = document.querySelector('.more-button');

      // Toggle Menu Functionality
      function toggleMenu(state) {
        const isActive = state !== undefined ? state : !listContainer.classList.contains('active');
        listContainer.classList.toggle('active', isActive);
        moreButton.setAttribute('aria-expanded', isActive ? 'true' : 'false');
      }

      moreButton.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMenu();
      });

      // Close menu when clicking outside
      document.addEventListener('click', (e) => {
        if (!listContainer.contains(e.target) && listContainer.classList.contains('active')) {
          toggleMenu(false);
        }
      });

      // Close menu on ESC key press
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && listContainer.classList.contains('active')) {
          toggleMenu(false);
        }
      });
    });
  </script>
