<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Motorisation Feature</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #2B2D33;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Section Container */
    .feature-card {
      background: #363940;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    /* Left: Awning Interactive Visual */
    .awning-display {
      position: relative;
      background: #1e2025;
      border-radius: 12px;
      height: 280px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wall-mount {
      width: 100%;
      height: 20px;
      background: #555;
      z-index: 3;
    }

    /* The HTML Retractable Canvas (Prop) */
    .awning-fabric {
      width: 85%;
      height: 0px; /* Controlled via JS toggle */
      background: linear-gradient(135deg, #BAB86C 0%, #a1a058 100%);
      border-bottom: 6px solid #878546;
      transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      z-index: 2;
    }

    .awning-fabric.extended {
      height: 160px;
    }

    /* Right: Text & Control Panel */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .feature-title {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.1;
      color: #ffffff;
    }

    .feature-title span {
      color: #BAB86C;
    }

    .feature-desc {
      font-size: 0.95rem;
      color: #ccc;
      line-height: 1.5;
    }

    /* Interactive Switch Component */
    .control-stage {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #2B2D33;
      padding: 15px 20px;
      border-radius: 12px;
      position: relative;
    }

    .remote-btn {
      background: #BAB86C;
      color: #2B2D33;
      border: none;
      padding: 12px 24px;
      font-weight: 800;
      border-radius: 30px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s ease, background 0.2s ease;
      z-index: 10;
    }

    .remote-btn:active {
      transform: scale(0.95);
    }

    /* 3D Character overlayed right beside the button */
    .character-container {
      width: 110px;
      height: 180px;
      position: absolute;
      right: 10px;
      bottom: -10px;
      pointer-events: none;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    @media (max-width: 768px) {
      .feature-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="feature-card">
    
    <!-- Left: Awning Extended Visual -->
    <div class="awning-display">
      <div class="wall-mount"></div>
      <div class="awning-fabric" id="awningFabric"></div>
    </div>

    <!-- Right: Text & Control Stage -->
    <div class="controls-wrapper">
      <h2 class="feature-title">One-Touch <span>Motorisation</span></h2>
      <p class="feature-desc">Control shade coverage instantly with automated smart sensors and quiet motor operation.</p>

      <div class="control-stage">
        <button class="remote-btn" id="toggleBtn">Deploy Awning</button>

        <!-- Character overlayed to act as the operator -->
        <div class="character-container">
          <model-viewer 
            id="operatorChar"
            src="assets/UAL1_Standard.glb" 
            autoplay 
            loop 
            interaction-prompt="none"
            camera-orbit="-40deg 75deg 90%"
            camera-target="0m 0.8m 0m">
          </model-viewer>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggleBtn');
      const awningFabric = document.getElementById('awningFabric');
      const character = document.getElementById('operatorChar');
      let isExtended = false;

      // Color tinting setup
      character.addEventListener('load', () => {
        const primaryColor = [0.169, 0.176, 0.200, 1.0]; // #2B2D33
        const oliveColor = [0.73, 0.72, 0.42, 1.0];     // #BAB86C

        if (character.model && character.model.materials) {
          character.model.materials.forEach((mat, idx) => {
            if (mat.pbrMetallicRoughness) {
              mat.pbrMetallicRoughness.setBaseColorFactor(idx === 0 ? primaryColor : oliveColor);
            }
          });
        }
      });

      // Synchronise UI Button, HTML Prop Animation, and Character Gesture
      toggleBtn.addEventListener('click', () => {
        isExtended = !isExtended;
        
        // 1. Extend/Retract the HTML Fabric
        awningFabric.classList.toggle('extended', isExtended);
        toggleBtn.textContent = isExtended ? 'Retract Awning' : 'Deploy Awning';

        // 2. Play gesture animation clip on the character when clicked
        const clips = character.availableAnimations || [];
        const actionClip = clips.find(c => c.toLowerCase().includes('interact')) ||
                           clips.find(c => c.toLowerCase().includes('wave')) || 
                           clips[0];
        
        if (actionClip) {
          character.animationName = actionClip;
          character.play();
          
          // Return to idle after gesture finishes
          setTimeout(() => {
            const idleClip = clips.find(c => c.toLowerCase().includes('idle')) || clips[0];
            character.animationName = idleClip;
            character.play();
          }, 1200);
        }
      });
    });
  </script>

</body>
</html>
