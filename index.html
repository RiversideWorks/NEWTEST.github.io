<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIG BOLD Hero Section</title>
    
    <!-- Importing a Big Bold font (Inter) and an elegant Serif (Playfair Display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           CSS STYLING
           ========================================= */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #050505; /* Deep black background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevents scrollbars during animation */
        }

        .hero-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Big Bold Wordmark Container */
        .wordmark {
            display: flex;
            align-items: center;
            font-size: 14vw; /* Scales with screen width */
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .letter {
            position: relative;
            z-index: 2;
        }

        /* The 'I' that acts as the mask/canvas */
        .mask-container {
            position: relative;
            height: 10.5vw; /* Matches the visual height of the text */
            width: 2.8vw; /* Matches the visual width of the letter 'I' */
            margin: 0 0.8vw; /* Spacing between letters */
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* The container for the flashing images */
        .mask-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0; /* Hidden initially */
        }

        /* The accent mark that snaps up */
        .accent {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 8vw;
            line-height: 0;
            opacity: 0;
            transform: translateY(0) rotate(15deg);
            pointer-events: none;
        }

        /* The contextual text that fades in */
        .side-text {
            position: absolute;
            left: calc(100% + 4vw); /* Positions it perfectly to the right of the logo */
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5vw;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            opacity: 0;
            white-space: nowrap;
            line-height: 1.3;
            color: #dddddd;
            border-left: 2px solid #333;
            padding-left: 1vw;
        }
    </style>
</head>
<body>

    <!-- =========================================
         HTML STRUCTURE
         ========================================= -->
    <div class="hero-container">
        <div class="wordmark">
            <div class="letter">S</div>
            <div class="letter">K</div>
            
            <!-- The expanding middle section -->
            <div class="mask-container" id="mask">
                <div class="mask-inner" id="mask-inner"></div>
                <div class="accent" id="accent">´</div>
            </div>
            
            <div class="letter">C</div>
            <div class="letter">A</div>
        </div>
        
        <!-- Text that appears at the end of the animation -->
        <div class="side-text" id="side-text">
            Creative Developer<br>
            Open Source Contributor<br>
            \ GitHub \
        </div>
    </div>

    <!-- =========================================
         JAVASCRIPT & GSAP ANIMATION
         ========================================= -->
    <!-- Importing GSAP (GreenSock) for high-performance timelines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script>
        // Array of images to flash (Replace with your own project screenshots/GIFs)
        const images = [
            "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80", // Tech/Code
            "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80", // Circuit
            "https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80", // Workspace
            "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80"  // Matrix code
        ];

        // Select DOM Elements
        const maskContainer = document.getElementById('mask');
        const maskInner = document.getElementById('mask-inner');
        const accent = document.getElementById('accent');
        const sideText = document.getElementById('side-text');

        // Create a looping master timeline
        const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.5 });

        // Step 1: Expand the "I" mask horizontally
        tl.to(maskContainer, {
            width: "30vw", // Expands to reveal images
            duration: 0.8,
            ease: "power3.inOut"
        });

        // Step 2: Fade in the image container
        tl.to(maskInner, { opacity: 1, duration: 0.1 });

        // Step 3: Rapidly flash through the images
        images.forEach((img) => {
            tl.set(maskInner, { backgroundImage: `url(${img})` }, "+=0.2"); // 0.2 seconds per image
        });

        // Step 4: Fade out the image container
        tl.to(maskInner, { opacity: 0, duration: 0.1 }, "+=0.2");

        // Step 5: Contract the mask back into an "I" shape
        tl.to(maskContainer, {
            width: "2.8vw", 
            duration: 0.8,
            ease: "power3.inOut"
        });

        // Step 6: Shoot the accent mark up & Fade in the context text simultaneously
        tl.to(accent, {
            opacity: 1,
            y: "-3.5vw", // Moves up
            x: "1.5vw",  // Moves slightly right
            duration: 0.6,
            ease: "back.out(1.7)" // Adds a nice little "snap" effect
        }, "-=0.3"); // Starts slightly before the contraction finishes

        tl.to(sideText, {
            opacity: 1,
            x: "2vw", // Slides in slightly
            duration: 0.8,
            ease: "power2.out"
        }, "<"); // "<" means it starts at the exact same time as the previous animation

        // Step 7: Hold the final state so the user can read it, then reset for the loop
        tl.to([accent, sideText], {
            opacity: 0,
            duration: 0.6,
            delay: 4 // Holds the final logo state for 4 seconds
        });

        // Reset the accent position instantly for the next loop
        tl.set(accent, { y: 0, x: 0 });
        tl.set(sideText, { x: 0 });

    </script>
</body>
</html>
