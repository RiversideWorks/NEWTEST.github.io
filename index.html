<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Animation Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* Hero Section Container */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0b0f19 70%);
    }

    /* Ambient Canvas Layer */
    #hero-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Glowing Background Orbs (CSS Fallback) */
    .glow-orb {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 2;
      animation: float 8s infinite ease-in-out alternate;
    }

    @keyframes float {
      0% { transform: translate(-20px, -20px); }
      100% { transform: translate(30px, 20px); }
    }

    /* Hero Content Layout */
    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 850px;
      padding: 2rem;
      text-align: center;
    }

    .hero-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      font-size: 0.85rem;
      font-weight: 600;
      color: #a5b4fc;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .hero-title {
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
      color: #ffffff;
    }

    .hero-title span {
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 auto 2.5rem auto;
      max-width: 600px;
    }

    /* Interactive Buttons */
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
    }

    .btn-primary:hover {
      background: #4338ca;
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(79, 70, 229, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="glow-orb"></div>
    <canvas id="hero-canvas"></canvas>

    <div class="hero-content">
      <div class="hero-badge">Interactive Hero Component</div>
      <h1 class="hero-title">Build High Impact Web Experiences with <span>Fluid Animation</span></h1>
      <p class="hero-subtitle">
        A lightweight interactive canvas hero section combining particle connection physics with modern gradient styling.
      </p>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="alert('Primary CTA Clicked!')">Get Started</button>
        <button class="btn btn-secondary" onclick="alert('Secondary CTA Clicked!')">Documentation</button>
      </div>
    </div>
  </section>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('hero-canvas');
      const ctx = canvas.getContext('2d');

      let width, height;
      let particles = [];
      const particleCount = 60;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.8;
          this.vy = (Math.random() - 0.5) * 0.8;
          this.radius = Math.random() * 2 + 1;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > width) this.vx *= -1;
          if (this.y < 0 || this.y > height) this.vy *= -1;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(165, 180, 252, 0.7)';
          ctx.fill();
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();

          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(99, 102, 241, ${1 - dist / 120})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }

      animate();
    });
  </script>
</body>
</html>
