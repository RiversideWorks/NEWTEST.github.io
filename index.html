<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrison Awning</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&display=swap" rel="stylesheet">

  <!-- Model Viewer Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* -------------------------------------------------------------
       1. GLOBAL RESET
    ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #ffffff;
      color: #2B2D33;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* -------------------------------------------------------------
       2. TOP NAVIGATION
    ------------------------------------------------------------- */
    .navbar {
      width: 100%;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .nav-pills {
      display: flex;
      gap: 12px;
      list-style: none;
    }

    .pill-btn {
      text-decoration: none;
      color: #2B2D33;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 26px;
      border: 1.5px solid #2B2D33;
      border-radius: 50px;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      background-color: #2B2D33;
      color: #ffffff;
    }

    .hamburger-icon {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .hamburger-icon span {
      width: 24px;
      height: 2px;
      background-color: #2B2D33;
      border-radius: 2px;
    }

    /* -------------------------------------------------------------
       3. HERO SECTION & LAYOUT
    ------------------------------------------------------------- */
    .hero-section {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: calc(100vh - 90px);
    }

    /* Olive Bottom Banner */
    .olive-banner {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 180px; /* Matched height from design */
      background-color: #BAB86C;
      z-index: 1;
    }

    .hero-container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 0 40px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: flex-end;
      position: relative;
      z-index: 2;
    }

    /* Typography Alignment */
    .hero-title {
      font-size: clamp(5rem, 11vw, 11.5rem);
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: -4px;
      color: #2B2D33;
      margin-bottom: 25px; /* Aligns "Morrison" above olive bar & "Awning" straddling top line */
    }

    .hero-title span {
      display: block;
    }

    /* 3D Character Stage */
    .characters-stage {
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 35px; /* Places character feet directly on top edge of olive bar */
    }

    .character-slot {
      width: 210px; /* Increased size to match reference image */
      height: 420px;
      pointer-events: none;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: transparent;
      background: transparent;
    }

    model-viewer::part(default-progress-bar) {
      display: none;
    }

    /* -------------------------------------------------------------
       4. RESPONSIVE BREAKPOINTS
    ------------------------------------------------------------- */
    @media (max-width: 1024px) {
      .hero-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .hero-title {
        letter-spacing: -2px;
        margin-bottom: 10px;
      }

      .characters-stage {
        justify-content: center;
        margin-bottom: 10px;
      }

      .character-slot {
        width: 150px;
        height: 300px;
      }

      .olive-banner {
        height: 120px;
      }
    }

    @media (max-width: 576px) {
      .nav-pills {
        gap: 6px;
      }

      .pill-btn {
        padding: 8px 14px;
        font-size: 11px;
      }

      .hamburger-icon {
        right: 20px;
      }

      .navbar {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <ul class="nav-pills">
      <li><a href="#who" class="pill-btn">Who Us?</a></li>
      <li><a href="#offerings" class="pill-btn">Offerings</a></li>
      <li><a href="#chat" class="pill-btn">Wanna Chat?</a></li>
    </ul>

    <div class="hamburger-icon" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="hero-section">
    
    <div class="hero-container">
      <!-- Left: Title Text -->
      <h1 class="hero-title">
        <span>Morrison</span>
        <span>Awning</span>
      </h1>

      <!-- Right: Two Talking Characters -->
      <div class="characters-stage">
        
        <!-- Left Talking Character (Facing Right-Center) -->
        <div class="character-slot">
          <model-viewer 
            id="char-left"
            src="assets/UAL1_Standard.glb" 
            autoplay 
            loop 
            interaction-prompt="none"
            camera-orbit="-25deg 75deg 85%" 
            camera-target="0m 0.9m 0m"
            exposure="1.2"
            shadow-intensity="0">
          </model-viewer>
        </div>

        <!-- Right Talking Character (Facing Left-Center) -->
        <div class="character-slot">
          <model-viewer 
            id="char-right"
            src="assets/UAL1_Standard.glb" 
            autoplay 
            loop 
            interaction-prompt="none"
            camera-orbit="25deg 75deg 85%" 
            camera-target="0m 0.9m 0m"
            exposure="1.2"
            shadow-intensity="0">
          </model-viewer>
        </div>

      </div>
    </div>

    <!-- Olive Bottom Banner -->
    <div class="olive-banner"></div>

  </main>

  <!-- Script: Animation Trigger & Color Fix -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const charLeft = document.querySelector('#char-left');
      const charRight = document.querySelector('#char-right');

      // Vivid color values to ensure #BAB86C pops clearly without fading
      const primaryColor = [0.169, 0.176, 0.200, 1.0];   // #2B2D33
      const secondaryColor = [0.73, 0.72, 0.42, 1.0];     // #BAB86C

      const setupCharacter = (viewer) => {
        viewer.addEventListener('load', () => {
          // Play talking animation clip
          const animations = viewer.availableAnimations || [];
          const talkClip = animations.find(a => a.toLowerCase().includes('talk')) ||
                           animations.find(a => a.toLowerCase().includes('idle')) ||
                           animations[0];
          
          if (talkClip) {
            viewer.animationName = talkClip;
            viewer.play();
          }

          // Apply color factors and set surface roughness to ensure colors are rich
          if (viewer.model && viewer.model.materials) {
            viewer.model.materials.forEach((mat, index) => {
              if (mat.pbrMetallicRoughness) {
                mat.pbrMetallicRoughness.setRoughnessFactor(0.6);
                mat.pbrMetallicRoughness.setMetallicFactor(0.0);
                
                if (index === 0) {
                  mat.pbrMetallicRoughness.setBaseColorFactor(primaryColor);
                } else {
                  mat.pbrMetallicRoughness.setBaseColorFactor(secondaryColor);
                }
              }
            });
          }
        });
      };

      setupCharacter(charLeft);
      setupCharacter(charRight);
    });
  </script>

</body>
</html>
