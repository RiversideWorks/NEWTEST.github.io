<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Particle Portal Component</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #030712;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .wrapper {
      position: relative;
      padding: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .kinetic-btn {
      position: relative;
      z-index: 2;
      padding: 22px 52px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f3f4f6;
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid rgba(147, 51, 234, 0.4);
      border-radius: 20px;
      cursor: pointer;
      outline: none;
      backdrop-filter: blur(20px);
      transform-style: preserve-3d;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                  inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .kinetic-btn:hover {
      border-color: rgba(192, 132, 252, 0.8);
      box-shadow: 0 25px 60px rgba(147, 51, 234, 0.35), 
                  inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .btn-text {
      display: inline-block;
      transform: translateZ(35px);
      transition: transform 0.3s ease;
      text-shadow: 0 0 15px rgba(192, 132, 252, 0.6);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="wrapper" id="wrapper">
    <canvas id="canvas"></canvas>
    <button class="kinetic-btn" id="btn">
      <span class="btn-text">Engage Core</span>
    </button>
  </div>

  <script>
    const wrapper = document.getElementById('wrapper');
    const btn = document.getElementById('btn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    const particleCount = 90;
    let mouse = { x: null, y: null, active: false };

    function resizeCanvas() {
      width = canvas.width = wrapper.offsetWidth;
      height = canvas.height = wrapper.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        const rect = btn.getBoundingClientRect();
        const wrapperRect = wrapper.getBoundingClientRect();

        // Calculate button perimeter coordinates relative to canvas
        const btnLeft = rect.left - wrapperRect.left;
        const btnTop = rect.top - wrapperRect.top;
        
        // Distribute along outer perimeter
        if (Math.random() > 0.5) {
          this.baseX = btnLeft + Math.random() * rect.width;
          this.baseY = Math.random() > 0.5 ? btnTop : btnTop + rect.height;
        } else {
          this.baseX = Math.random() > 0.5 ? btnLeft : btnLeft + rect.width;
          this.baseY = btnTop + Math.random() * rect.height;
        }

        this.x = this.baseX;
        this.y = this.baseY;
        this.vx = 0;
        this.vy = 0;
        this.size = Math.random() * 2.5 + 1;
        this.color = Math.random() > 0.5 ? '#c084fc' : '#818cf8';
        this.spring = 0.04 + Math.random() * 0.03;
        this.friction = 0.85;
      }

      update() {
        // Return to perimeter force (spring physics)
        let dx = this.baseX - this.x;
        let dy = this.baseY - this.y;
        this.vx += dx * this.spring;
        this.vy += dy * this.spring;

        // Mouse attraction/repulsion inside canvas bounds
        if (mouse.active) {
          let mdx = mouse.x - this.x;
          let mdy = mouse.y - this.y;
          let dist = Math.sqrt(mdx * mdx + mdy * mdy);
          if (dist < 120) {
            let force = (120 - dist) / 120;
            this.vx += (mdx / dist) * force * 2.5;
            this.vy += (mdy / dist) * force * 2.5;
          }
        }

        this.vx *= this.friction;
        this.vy *= this.friction;
        this.x += this.vx;
        this.y += this.vy;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fill();
      }

      explode() {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 18 + 6;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    // Connect particles with translucent energy lines
    function connectParticles() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a; b < particles.length; b++) {
          let dx = particles[a].x - particles[b].x;
          let dy = particles[a].y - particles[b].y;
          let dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 45) {
            ctx.strokeStyle = `rgba(192, 132, 252, ${1 - dist / 45})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      connectParticles();
      requestAnimationFrame(render);
    }
    render();

    // Mouse spatial tracking & 3D Tilt Matrix
    wrapper.addEventListener('mousemove', (e) => {
      const rect = wrapper.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.active = true;

      const btnRect = btn.getBoundingClientRect();
      const centerX = btnRect.left + btnRect.width / 2;
      const centerY = btnRect.top + btnRect.height / 2;
      
      const rotateX = (e.clientY - centerY) / -12;
      const rotateY = (e.clientX - centerX) / 12;

      btn.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
    });

    wrapper.addEventListener('mouseleave', () => {
      mouse.active = false;
      btn.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)`;
    });

    // Kinetic disintegration trigger on click
    btn.addEventListener('click', () => {
      particles.forEach(p => p.explode());
      btn.style.transform = `perspective(1000px) scale(0.92) translateZ(-10px)`;
      setTimeout(() => {
        btn.style.transform = `perspective(1000px) scale(1) translateZ(0px)`;
      }, 150);
    });
  </script>
</body>
</html>
