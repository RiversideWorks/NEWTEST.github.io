<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrison Awning - Interactive Scene</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&display=swap" rel="stylesheet">

  <!-- Model Viewer Script -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* -------------------------------------------------------------
       1. GLOBAL RESET & BASE STYLES
    ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #ffffff;
      color: #2B2D33;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* -------------------------------------------------------------
       2. TOP NAVIGATION (PILL BUTTONS & HAMBURGER)
    ------------------------------------------------------------- */
    .navbar {
      width: 100%;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .nav-pills {
      display: flex;
      gap: 12px;
      list-style: none;
    }

    .pill-btn {
      text-decoration: none;
      color: #2B2D33;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 24px;
      border: 1.5px solid #2B2D33;
      border-radius: 50px;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      background-color: #2B2D33;
      color: #ffffff;
    }

    .hamburger-icon {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .hamburger-icon span {
      width: 24px;
      height: 2px;
      background-color: #2B2D33;
      border-radius: 2px;
    }

    /* -------------------------------------------------------------
       3. HERO SECTION & LAYOUT
    ------------------------------------------------------------- */
    .hero-section {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: calc(100vh - 90px);
    }

    /* Bottom Olive Band */
    .olive-banner {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 110px;
      background-color: #BAB86C;
      z-index: 1;
    }

    .hero-container {
      max-width: 1350px;
      width: 100%;
      margin: 0 auto;
      padding: 0 40px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: flex-end;
      position: relative;
      z-index: 2;
      padding-bottom: 0px;
    }

    /* Title Styling */
    .hero-title {
      font-size: clamp(4.5rem, 9.5vw, 9.5rem);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -3px;
      color: #2B2D33;
      margin-bottom: 20px;
    }

    .hero-title span {
      display: block;
    }

    /* 3D Character Stage (Side-by-Side Talking Duo) */
    .characters-stage {
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      gap: 15px;
      height: 280px;
      margin-bottom: 10px;
    }

    .character-slot {
      width: 120px;
      height: 260px;
      pointer-events: none; /* Disables mouse drag interference */
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: transparent;
      background: transparent;
    }

    model-viewer::part(default-progress-bar) {
      display: none;
    }

    /* -------------------------------------------------------------
       4. RESPONSIVE BREAKPOINTS
    ------------------------------------------------------------- */
    @media (max-width: 992px) {
      .hero-container {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .olive-banner {
        height: 80px;
      }

      .characters-stage {
        justify-content: center;
        height: 220px;
      }

      .character-slot {
        width: 100px;
        height: 200px;
      }

      .hamburger-icon {
        right: 20px;
      }

      .navbar {
        padding: 20px;
      }
    }

    @media (max-width: 576px) {
      .nav-pills {
        gap: 6px;
      }

      .pill-btn {
        padding: 8px 14px;
        font-size: 11px;
      }

      .hero-title {
        letter-spacing: -1px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <ul class="nav-pills">
      <li><a href="#who" class="pill-btn">Who Us?</a></li>
      <li><a href="#offerings" class="pill-btn">Offerings</a></li>
      <li><a href="#chat" class="pill-btn">Wanna Chat?</a></li>
    </ul>

    <div class="hamburger-icon" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="hero-section">
    
    <div class="hero-container">
      <!-- Left: Title Text -->
      <h1 class="hero-title">
        <span>Morrison</span>
        <span>Awning</span>
      </h1>

      <!-- Right: Two Talking Characters -->
      <div class="characters-stage">
        
        <!-- Left Talking Character -->
        <div class="character-slot">
          <model-viewer 
            id="char-left"
            src="assets/UAL1_Standard.glb" 
            autoplay 
            loop 
            interaction-prompt="none"
            camera-orbit="-30deg 75deg 105%" 
            shadow-intensity="0">
          </model-viewer>
        </div>

        <!-- Right Talking Character -->
        <div class="character-slot">
          <model-viewer 
            id="char-right"
            src="assets/UAL1_Standard.glb" 
            autoplay 
            loop 
            interaction-prompt="none"
            camera-orbit="150deg 75deg 105%" 
            shadow-intensity="0">
          </model-viewer>
        </div>

      </div>
    </div>

    <!-- Olive Bottom Banner -->
    <div class="olive-banner"></div>

  </main>

  <!-- JavaScript: Animation Trigger & Color Replacement Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const charLeft = document.querySelector('#char-left');
      const charRight = document.querySelector('#char-right');

      // Primary Color: #2B2D33 -> [0.169, 0.176, 0.200, 1.0]
      // Secondary Accent: #BAB86C -> [0.729, 0.721, 0.423, 1.0]
      const primaryColor = [0.169, 0.176, 0.200, 1.0];
      const secondaryColor = [0.729, 0.721, 0.423, 1.0];

      const setupCharacter = (viewer) => {
        viewer.addEventListener('load', () => {
          // 1. Play 'idle_talk' or fallback to available talking/idle animation
          const animations = viewer.availableAnimations || [];
          const talkClip = animations.find(a => a.toLowerCase().includes('talk')) ||
                           animations.find(a => a.toLowerCase().includes('idle')) ||
                           animations[0];
          
          if (talkClip) {
            viewer.animationName = talkClip;
            viewer.play();
          }

          // 2. Apply custom dual-tone material colors (#2B2D33 and #BAB86C)
          if (viewer.model && viewer.model.materials) {
            viewer.model.materials.forEach((mat, index) => {
              if (mat.pbrMetallicRoughness) {
                // First material index receives primary dark charcoal, second receives olive accent
                if (index === 0) {
                  mat.pbrMetallicRoughness.setBaseColorFactor(primaryColor);
                } else {
                  mat.pbrMetallicRoughness.setBaseColorFactor(secondaryColor);
                }
              }
            });
          }
        });
      };

      setupCharacter(charLeft);
      setupCharacter(charRight);
    });
  </script>

</body>
</html>
