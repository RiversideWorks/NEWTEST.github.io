<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atmospheric Puzzle Platformer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
      color: #777;
    }
    canvas {
      border: 1px solid #222;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      background: #141619;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="ui">Controls: [A/D] Move | [W / Space] Jump | Hold [E] Push/Pull Box</div>
  <canvas id="gameCanvas" width="900" height="500"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Input tracking
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // World & Camera
    const gravity = 0.5;
    const camera = { x: 0, y: 0 };

    // Player Object
    const player = {
      x: 100, y: 300, width: 18, height: 42,
      vx: 0, vy: 0, speed: 3.5, jumpPower: -9.5,
      grounded: false, grabbing: false
    };

    // Movable Box (Puzzle element)
    const box = {
      x: 500, y: 340, width: 40, height: 40,
      vx: 0, vy: 0, grounded: false
    };

    // Environment Platforms
    const platforms = [
      { x: 0, y: 400, width: 1200, height: 100 },      // Ground
      { x: 750, y: 280, width: 300, height: 120 },     // High Ledge
      { x: 1250, y: 200, width: 400, height: 300 }     // End Ledge
    ];

    function update() {
      // 1. Player Horizontal Movement
      player.vx = 0;
      if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -player.speed;
      if (keys['KeyD'] || keys['ArrowRight']) player.vx = player.speed;

      // 2. Jumping
      if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }

      // 3. Gravity
      player.vy += gravity;
      box.vy += gravity;

      // 4. Box Interaction (Push/Pull)
      const distToBox = Math.abs((player.x + player.width / 2) - (box.x + box.width / 2));
      const nearBox = distToBox < 35 && Math.abs(player.y - box.y) < 20;

      if (keys['KeyE'] && nearBox) {
        player.grabbing = true;
        box.vx = player.vx; // Box moves with player
      } else {
        player.grabbing = false;
        box.vx *= 0.8; // Friction
      }

      // Apply horizontal movement
      player.x += player.vx;
      box.x += box.vx;

      // Box vs Platforms Collisions
      box.grounded = false;
      platforms.forEach(p => {
        if (box.x < p.x + p.width && box.x + box.width > p.x &&
            box.y + box.height <= p.y + box.vy && box.y + box.height + box.vy >= p.y) {
          box.vy = 0;
          box.y = p.y - box.height;
          box.grounded = true;
        }
      });
      box.y += box.vy;

      // Player vs Box Collision (Stand on box / Push obstacle)
      if (player.x < box.x + box.width && player.x + player.width > box.x) {
        // Landing on box
        if (player.y + player.height <= box.y && player.y + player.height + player.vy >= box.y) {
          player.vy = 0;
          player.y = box.y - player.height;
          player.grounded = true;
        } 
        // Side collision (Pushing without grabbing)
        else if (!player.grabbing) {
          if (player.vx > 0 && player.x + player.width <= box.x + 10) player.x = box.x - player.width;
          if (player.vx < 0 && player.x >= box.x + box.width - 10) player.x = box.x + box.width;
        }
      }

      // Player vs Platforms Collision
      player.grounded = false;
      platforms.forEach(p => {
        // Vertical collision
        if (player.x + player.width > p.x && player.x < p.x + p.width) {
          if (player.y + player.height <= p.y && player.y + player.height + player.vy >= p.y) {
            player.vy = 0;
            player.y = p.y - player.height;
            player.grounded = true;
          }
        }
        // Horizontal wall collision
        if (player.y + player.height > p.y + 5 && player.y < p.y + p.height) {
          if (player.vx > 0 && player.x + player.width <= p.x + 10) player.x = p.x - player.width;
          if (player.vx < 0 && player.x >= p.x + p.width - 10) player.x = p.x + p.width;
        }
      });

      player.y += player.vy;

      // Camera Tracking
      camera.x += (player.x - canvas.width / 3 - camera.x) * 0.05;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-Math.round(camera.x), 0);

      // Background Fog Elements
      ctx.fillStyle = "#1c2026";
      ctx.fillRect(200, 150, 80, 250);
      ctx.fillRect(600, 100, 120, 300);

      // Draw Platforms (Silhouettes)
      ctx.fillStyle = "#090a0c";
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
      });

      // Draw Puzzle Box
      ctx.fillStyle = "#2d3238";
      ctx.fillRect(box.x, box.y, box.width, box.height);
      ctx.strokeStyle = "#1a1d21";
      ctx.strokeRect(box.x, box.y, box.width, box.height);

      // Draw Player Silhouette
      ctx.fillStyle = player.grabbing ? "#3a4149" : "#e0e0e0";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Atmospheric Vignette/Lighting Overlay
      ctx.restore();
      const gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 100,
        canvas.width / 2, canvas.height / 2, 500
      );
      gradient.addColorStop(0, "rgba(0,0,0,0)");
      gradient.addColorStop(1, "rgba(0,0,0,0.75)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
