<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hovering Bee Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* A soft background color like sky/garden */
            background-color: #f0f8ff; 
            overflow: hidden;
        }

        /* 
           1. HOVER CONTAINER 
           This element handles the gentle bobbing up and down.
        */
        .bee-hover-container {
            position: relative;
            animation: hoverBob 1.5s ease-in-out infinite;
        }

        /*
           2. THE BEE BODY 
           Acts as the main container for body parts and sets the base color.
        */
        .bee {
            position: relative;
            width: 50px;
            height: 35px;
            background: #FFC107; /* Golden yellow */
            border-radius: 20px;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1);
        }

        /* Head */
        .bee::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 5px;
            width: 25px;
            height: 25px;
            background: #212121; /* Black/Dark gray */
            border-radius: 50%;
        }

        /* Eyes */
        .bee-eye {
            position: absolute;
            z-index: 2;
            top: 10px;
            left: -2px;
            width: 6px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        /* Stripes on body */
        .bee-stripes {
            position: absolute;
            top: 0;
            left: 15px;
            width: 25px;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                #212121,
                #212121 5px,
                transparent 5px,
                transparent 10px
            );
        }

        /* Stinger */
        .bee-stinger {
            position: absolute;
            right: -6px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 8px solid #212121;
        }

        /* 
           3. THE WINGS 
        */
        .wings {
            position: absolute;
            top: -15px;
            left: 10px;
            width: 30px;
            height: 30px;
            z-index: -1; /* Wings sit behind the body slightly */
        }

        .wing {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(200, 200, 200, 0.5);
            border-radius: 50% 50% 0 50%;
            transform-origin: bottom right;
        }

        /* Back wing */
        .wing-1 {
            width: 25px;
            height: 25px;
            top: 5px;
            left: 5px;
            opacity: 0.8;
            /* Flaps slightly slower and with a delay for realism */
            animation: flap 0.1s ease-in-out infinite alternate;
        }

        /* Front wing */
        .wing-2 {
            width: 28px;
            height: 28px;
            top: 0;
            left: 0;
            /* Extremely fast flapping */
            animation: flap 0.08s ease-in-out infinite alternate-reverse;
        }

        /*
           4. ANIMATION KEYFRAMES
        */

        /* Hover bobbing (Gentle Up/Down) */
        @keyframes hoverBob {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        /* Wing Flapping (Rotation on Y-axis and slight movement) */
        @keyframes flap {
            0% {
                transform: rotateY(0deg) translateY(0);
            }
            100% {
                /* A higher degree creates a blur effect, like rapid movement */
                transform: rotateY(70deg) translateY(2px);
            }
        }
    </style>
</head>
<body>

    <!-- Main Container ensuring it stays centrally located -->
    <div class="main-container">
        <!-- Bobbing Container -->
        <div class="bee-hover-container">
            <!-- Bee Body -->
            <div class="bee">
                <div class="bee-eye"></div>
                <div class="bee-stripes"></div>
                <div class="bee-stinger"></div>
                <!-- Wings Container inside the bobbing container -->
                <div class="wings">
                    <div class="wing wing-1"></div>
                    <div class="wing wing-2"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
