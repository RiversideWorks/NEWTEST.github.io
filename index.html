<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Motorisation Feature</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #1e2025;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Main Section Card */
    .feature-card {
      background: #2B2D33;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      max-width: 950px;
      width: 100%;
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    /* Interactive Awning Canvas */
    .awning-display {
      position: relative;
      background: #18191c;
      border-radius: 14px;
      height: 320px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .wall-mount {
      width: 100%;
      height: 24px;
      background: #363940;
      z-index: 3;
    }

    .awning-fabric {
      width: 90%;
      height: 0px;
      background: linear-gradient(180deg, #BAB86C 0%, #9a9852 100%);
      border-bottom: 6px solid #7a783d;
      transition: height 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 12px 25px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .awning-fabric.extended {
      height: 200px;
    }

    /* Controls & Content */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .feature-title {
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1.1;
      color: #ffffff;
    }

    .feature-title span {
      color: #BAB86C;
    }

    .feature-desc {
      font-size: 0.95rem;
      color: #b0b3bc;
      line-height: 1.6;
    }

    .control-stage {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #212328;
      padding: 16px 24px;
      border-radius: 14px;
      position: relative;
      margin-top: 10px;
    }

    .remote-btn {
      background: #BAB86C;
      color: #2B2D33;
      border: none;
      padding: 14px 28px;
      font-weight: 800;
      font-size: 0.95rem;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s ease, background 0.2s ease;
      z-index: 5;
    }

    .remote-btn:hover {
      background: #c5c377;
    }

    .remote-btn:active {
      transform: scale(0.96);
    }

    /* 3D Character Container */
    .character-container {
      width: 130px;
      height: 220px;
      position: absolute;
      right: 15px;
      bottom: -15px;
      pointer-events: none;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: transparent;
      background: transparent;
    }

    model-viewer::part(default-progress-bar) {
      display: none;
    }

    @media (max-width: 768px) {
      .feature-card {
        grid-template-columns: 1fr;
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="feature-card">
    
    <!-- Left: Awning Extended Visual -->
    <div class="awning-display">
      <div class="wall-mount"></div>
      <div class="awning-fabric" id="awningFabric"></div>
    </div>

    <!-- Right: Text & Control Panel -->
    <div class="controls-wrapper">
      <h2 class="feature-title">One-Touch <span>Motorisation</span></h2>
      <p class="feature-desc">Control shade coverage instantly with automated smart sensors and quiet motor operation.</p>

      <div class="control-stage">
        <button class="remote-btn" id="toggleBtn">Deploy Awning</button>

        <!-- Fixed HTML Attributes: explicitly set animation-name="idle_talk" -->
        <div class="character-container">
          <model-viewer 
            id="operatorChar"
            src="assets/UAL1_Standard.glb" 
            animation-name="idle_talk"
            autoplay 
            loop 
            interaction-prompt="none"
            camera-orbit="-25deg 75deg 85%"
            camera-target="0m 0.9m 0m"
            exposure="1.2">
          </model-viewer>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggleBtn');
      const awningFabric = document.getElementById('awningFabric');
      const character = document.getElementById('operatorChar');
      let isExtended = false;

      // Brand Colors: Primary (#2B2D33) & Secondary (#BAB86C)
      const primaryColor = [0.169, 0.176, 0.200, 1.0];
      const secondaryColor = [0.73, 0.72, 0.42, 1.0];

      character.addEventListener('load', () => {
        // Apply material colors cleanly on load
        if (character.model && character.model.materials) {
          character.model.materials.forEach((mat, idx) => {
            if (mat.pbrMetallicRoughness) {
              mat.pbrMetallicRoughness.setRoughnessFactor(0.5);
              mat.pbrMetallicRoughness.setMetallicFactor(0.0);
              mat.pbrMetallicRoughness.setBaseColorFactor(idx === 0 ? primaryColor : secondaryColor);
            }
          });
        }
        
        // Ensure default idle animation starts playing immediately
        character.animationName = 'idle_talk';
        character.play();
      });

      toggleBtn.addEventListener('click', () => {
        isExtended = !isExtended;
        
        // 1. Toggle Awning Fabric UI
        awningFabric.classList.toggle('extended', isExtended);
        toggleBtn.textContent = isExtended ? 'Retract Awning' : 'Deploy Awning';

        // 2. Play gesture clip safely, then FORCE return to idle_talk
        const available = character.availableAnimations || [];
        
        // Find safe gesture clip or fallback strictly to idle_talk
        const gestureClip = available.find(a => a.toLowerCase() === 'wave') ||
                            available.find(a => a.toLowerCase() === 'interact') ||
                            available.find(a => a.toLowerCase().includes('talk')) ||
                            'idle_talk';

        character.animationName = gestureClip;
        character.play();

        // 3. Reset back to continuous idle_talk after gesture completes
        setTimeout(() => {
          character.animationName = 'idle_talk';
          character.play();
        }, 1400);
      });
    });
  </script>

</body>
</html>
