<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pop-Out Interactive Cutout Cards</title>
    <style>
        /* =========================================
           1. RESET & CLEAN BACKDROP
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ededef;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header p {
            font-size: 0.95rem;
            color: #222;
            font-weight: 500;
            line-height: 1.4;
        }

        .header .arrow {
            display: block;
            margin-top: 6px;
            font-size: 1.1rem;
            color: #444;
        }

        /* =========================================
           2. CARDS CONTAINER & POP-UP BEHAVIOR
           ========================================= */
        .cards-container {
            display: flex;
            gap: 24px;
            justify-content: center;
            align-items: flex-end;
            max-width: 860px;
            width: 100%;
        }

        .card-wrapper {
            flex: 1;
            max-width: 380px;
        }

        .card {
            position: relative;
            background: #e2e2e5;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            padding: 12px;
            cursor: pointer;
            overflow: visible; /* Allows cutout to pop past top border */
            /* Strictly Pop Up upwards on hover (No side 3D tilting) */
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.35s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        /* Card strictly shifts upward on hover */
        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        /* =========================================
           3. COLORED GRADIENT SPOTLIGHT (Tracks Cursor)
           ========================================= */
        .card-glow {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 2;
        }

        /* Vibrant Multi-Color Gradient Spotlight for Card 1 (Cyan / Purple / Pink) */
        .card-1 .card-glow {
            background: radial-gradient(
                circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(56, 189, 248, 0.6) 0%,
                rgba(168, 85, 247, 0.45) 45%,
                rgba(236, 72, 153, 0.25) 70%,
                transparent 100%
            );
        }

        /* Vibrant Multi-Color Gradient Spotlight for Card 2 (Yellow / Orange / Mint) */
        .card-2 .card-glow {
            background: radial-gradient(
                circle 200px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(250, 204, 21, 0.65) 0%,
                rgba(249, 115, 22, 0.5) 45%,
                rgba(16, 185, 129, 0.25) 70%,
                transparent 100%
            );
        }

        .card:hover .card-glow {
            opacity: 1;
        }

        /* =========================================
           4. STAGE & POP-OUT CUTOUT
           ========================================= */
        .card-image-stage {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 14px;
            overflow: visible;
        }

        /* Clipped Background Layer */
        .bg-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            overflow: hidden;
            z-index: 3;
        }

        .bg-layer svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Foreground Cutout Layer (Pops Up and Out of Top Border) */
        .cutout-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            transform-origin: bottom center;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.15));
        }

        /* Subject pops higher upwards when hovered */
        .card:hover .cutout-layer {
            transform: translateY(-28px) scale(1.1);
            filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.28));
        }

        .cutout-layer svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Typography */
        .card-body {
            position: relative;
            z-index: 5;
            padding: 14px 6px 6px 6px;
        }

        .card-body h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }

        .card-body p {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.35;
        }

        /* Mobile Breakpoint */
        @media (max-width: 720px) {
            .cards-container {
                flex-direction: column;
                align-items: center;
                gap: 40px;
            }
            .card-wrapper {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <p>Hover your cursor<br>over the card.</p>
        <span class="arrow">↓</span>
    </div>

    <!-- Cards Section -->
    <div class="cards-container">

        <!-- CARD 1: Skateboarder -->
        <div class="card-wrapper">
            <div class="card card-1">
                <!-- Colored Gradient Glow Layer -->
                <div class="card-glow"></div>
                
                <div class="card-image-stage">
                    <!-- Background Layer (Sky) -->
                    <div class="bg-layer">
                        <svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
                            <defs>
                                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#7ca0c7"/>
                                    <stop offset="40%" stop-color="#b2c8de"/>
                                    <stop offset="100%" stop-color="#d9cfc1"/>
                                </linearGradient>
                            </defs>
                            <rect width="400" height="280" fill="url(#skyGrad)"/>
                            <path d="M 50,180 Q 80,140 130,160 Q 180,130 230,160 Q 270,140 320,170 Q 360,160 380,190 L 400,280 L 0,280 Z" fill="rgba(255,255,255,0.4)"/>
                            <path d="M 20,200 Q 70,170 120,190 Q 190,160 260,195 Q 310,180 370,210 L 400,280 L 0,280 Z" fill="rgba(255,255,255,0.6)"/>
                        </svg>
                    </div>

                    <!-- Cutout Layer (Jumping Skater Pops Up) -->
                    <div class="cutout-layer">
                        <svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid meet">
                            <g transform="translate(130, 25) scale(0.78)">
                                <path d="M 10 210 Q 70 230 130 180" stroke="#111" stroke-width="8" stroke-linecap="round" fill="none"/>
                                <circle cx="35" cy="212" r="6" fill="#444"/>
                                <circle cx="105" cy="190" r="6" fill="#444"/>
                                <path d="M 45 160 L 35 205 M 95 135 L 110 180" stroke="#2b303a" stroke-width="16" stroke-linecap="round"/>
                                <path d="M 50 100 L 80 145" stroke="#222" stroke-width="22" stroke-linecap="round"/>
                                <path d="M 50 100 L 10 75 M 65 105 L 115 90" stroke="#222" stroke-width="10" stroke-linecap="round"/>
                                <circle cx="45" cy="80" r="12" fill="#d0a880"/>
                                <path d="M 30 75 Q 45 65 60 78" stroke="#111" stroke-width="8" stroke-linecap="round"/>
                            </g>
                        </svg>
                    </div>
                </div>

                <div class="card-body">
                    <h3>Skateboarder</h3>
                    <p>Lorem ipsum dolor sit amet consectetur adipiscing elit</p>
                </div>
            </div>
        </div>

        <!-- CARD 2: Soda Can -->
        <div class="card-wrapper">
            <div class="card card-2">
                <!-- Colored Gradient Glow Layer -->
                <div class="card-glow"></div>
                
                <div class="card-image-stage">
                    <!-- Background Layer (Ocean) -->
                    <div class="bg-layer">
                        <svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
                            <defs>
                                <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#a4c2c2"/>
                                    <stop offset="50%" stop-color="#5a8f91"/>
                                    <stop offset="100%" stop-color="#2c5e63"/>
                                </linearGradient>
                            </defs>
                            <rect width="400" height="280" fill="url(#seaGrad)"/>
                            <path d="M 280 280 L 290 160 L 330 130 L 400 150 L 400 280 Z" fill="#3a3835"/>
                            <path d="M 310 280 L 330 180 L 370 160 L 400 190 L 400 280 Z" fill="#262422"/>
                        </svg>
                    </div>

                    <!-- Cutout Layer (Floating Drink Can Pops Up) -->
                    <div class="cutout-layer">
                        <svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid meet">
                            <g transform="translate(180, 45) rotate(-12)">
                                <rect x="0" y="20" width="55" height="100" rx="10" fill="#c02626"/>
                                <ellipse cx="27.5" cy="20" rx="27.5" ry="6" fill="#d1d5db"/>
                                <ellipse cx="27.5" cy="20" rx="22" ry="4" fill="#9ca3af"/>
                                <rect x="0" y="45" width="55" height="45" fill="#a11d1d"/>
                                <text x="27.5" y="72" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="sans-serif" transform="rotate(-90 27.5 72)">ESCUDO</text>
                                <rect x="6" y="20" width="8" height="100" fill="rgba(255,255,255,0.25)"/>
                            </g>
                        </svg>
                    </div>
                </div>

                <div class="card-body">
                    <h3>Lorem Ipsum</h3>
                    <p>Lorem ipsum dolor sit amet consectetur adipiscing elit</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Script ONLY tracks cursor for the multi-colored gradient spotlight -->
    <script>
        const cards = document.querySelectorAll('.card');

        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const mouseXPercent = (x / rect.width) * 100;
                const mouseYPercent = (y / rect.height) * 100;
                
                // Dynamically move the colored spotlight center
                card.style.setProperty('--mouse-x', `${mouseXPercent}%`);
                card.style.setProperty('--mouse-y', `${mouseYPercent}%`);
            });
        });
    </script>
</body>
</html>
