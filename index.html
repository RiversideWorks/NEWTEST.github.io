<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Magnetic Button</title>
  <style>
    :root {
      --bg: #0f172a;
      --glow-color: rgba(99, 102, 241, 0.6);
      --accent-color: #818cf8;
    }

    body {
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .magnetic-btn {
      position: relative;
      padding: 18px 42px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      backdrop-filter: blur(12px);
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), 
                  box-shadow 0.3s ease, 
                  border-color 0.3s ease;
      will-change: transform;
    }

    /* Glow Effect Overlay */
    .magnetic-btn::before {
      content: '';
      position: absolute;
      top: var(--y, 50%);
      left: var(--x, 50%);
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .magnetic-btn:hover {
      border-color: rgba(129, 140, 248, 0.5);
      box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
    }

    .magnetic-btn:hover::before {
      opacity: 1;
    }

    /* Click Ripple Layer */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0);
      animation: ripple-animation 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple-animation {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    .btn-text {
      position: relative;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <button class="magnetic-btn" id="btn">
    <span class="btn-text">Explore Interactive Component</span>
  </button>

  <script>
    const btn = document.getElementById('btn');

    // Magnetic cursor tracking and spotlight glow position
    btn.addEventListener('mousemove', (e) => {
      const rect = btn.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Update light source position
      btn.style.setProperty('--x', `${x}px`);
      btn.style.setProperty('--y', `${y}px`);

      // Calculate spring displacement (Magnetic Pull)
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const deltaX = (x - centerX) * 0.25;
      const deltaY = (y - centerY) * 0.25;

      btn.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0) scale(1.03)`;
    });

    // Reset button on leave
    btn.addEventListener('mouseleave', () => {
      btn.style.transform = `translate3d(0px, 0px, 0) scale(1)`;
    });

    // Ripple effect on click
    btn.addEventListener('click', (e) => {
      const rect = btn.getBoundingClientRect();
      const circle = document.createElement('span');
      const diameter = Math.max(rect.width, rect.height);
      const radius = diameter / 2;

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - rect.left - radius}px`;
      circle.style.top = `${e.clientY - rect.top - radius}px`;
      circle.classList.add('ripple');

      const existingRipple = btn.querySelector('.ripple');
      if (existingRipple) {
        existingRipple.remove();
      }

      btn.appendChild(circle);
    });
  </script>
</body>
</html>
