<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Section</title>
    <style>
        /* CSS Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        /* Layout */
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .left-panel {
            width: 40%;
            height: 100%;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .right-panel {
            width: 60%;
            height: 100%;
            background-color: #f5f5f5; /* Light background behind image */
        }

        /* Right Panel Image */
        #main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: opacity 0.3s ease-in-out;
        }

        /* Top Counter */
        .top-counter {
            text-align: right;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Navigation Menu */
        .menu {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-item {
            font-size: 3.5rem;
            font-weight: 600;
            color: #333; /* Dark grey for inactive */
            cursor: pointer;
            transition: color 0.3s ease;
            display: flex;
            align-items: flex-start;
            letter-spacing: -1.5px;
            line-height: 1.1;
        }

        /* Active State */
        .menu-item.active {
            color: #fff;
        }

        /* Superscript Number */
        .menu-item .sup-num {
            font-size: 0.8rem;
            font-weight: 500;
            margin-left: 8px;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            letter-spacing: 0;
        }

        .menu-item.active .sup-num {
            opacity: 1;
        }

        /* Bottom Description Text */
        .description-box {
            margin-top: auto; /* Pushes to bottom */
            max-width: 320px;
            padding-bottom: 20px;
        }

        .desc-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        .desc-body {
            font-size: 0.9rem;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Column -->
        <div class="left-panel">
            <div class="top-counter" id="counter">2 / 3</div>
            
            <div class="menu" id="menu-container">
                <!-- Menu items generated by JS -->
            </div>

            <div class="description-box">
                <div class="desc-title" id="desc-title">Setting a Style</div>
                <div class="desc-body" id="desc-body">
                    Not sure which direction to take your brand in? We can work together to create something which reflects your brand and looks beautiful.
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="right-panel">
            <img id="main-image" src="image_215fe1.png" alt="Showcase Image">
        </div>
    </div>

    <script>
        // Data structure holding all the content variations
        const sectionData = [
            {
                id: "01",
                heading: "3D design",
                title: "Bringing Concepts to Life",
                text: "Explore new dimensions. We craft immersive 3D elements that elevate your brand narrative and create stunning visual impact.",
                image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop" // Placeholder image for 3D Design
            },
            {
                id: "02",
                heading: "Art direction",
                title: "Setting a Style",
                text: "Not sure which direction to take your brand in? We can work together to create something which reflects your brand and looks beautiful.",
                image: "image_215fe1.png" // Exact requested filename
            },
            {
                id: "03",
                heading: "Motion",
                title: "Moving Experiences",
                text: "Add rhythm and pacing to your storytelling. Our motion graphics breathe life into static concepts, keeping audiences engaged.",
                image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2000&auto=format&fit=crop" // Placeholder image for Motion
            }
        ];

        // DOM Elements
        const menuContainer = document.getElementById('menu-container');
        const mainImage = document.getElementById('main-image');
        const descTitle = document.getElementById('desc-title');
        const descBody = document.getElementById('desc-body');
        const counter = document.getElementById('counter');

        let currentIndex = 1; // Default to "Art direction" (index 1) to match your screenshot

        // Function to initialize the menu
        function initMenu() {
            sectionData.forEach((item, index) => {
                const menuItem = document.createElement('div');
                menuItem.className = `menu-item ${index === currentIndex ? 'active' : ''}`;
                menuItem.innerHTML = `${item.heading} <span class="sup-num">(${item.id})</span>`;
                
                // Click Event
                menuItem.addEventListener('click', () => {
                    updateSection(index);
                });

                menuContainer.appendChild(menuItem);
            });
            
            // Set initial content
            updateContent(currentIndex);
        }

        // Function to handle the click and update the UI
        function updateSection(index) {
            if (index === currentIndex) return; // Do nothing if clicking the already active item

            currentIndex = index;

            // Update Active Classes
            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach((item, i) => {
                if (i === currentIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // Fade out effect for image
            mainImage.style.opacity = 0;
            
            setTimeout(() => {
                updateContent(currentIndex);
                mainImage.style.opacity = 1; // Fade back in
            }, 200); // Small delay to sync with CSS transition
        }

        // Function to swap out text and image data
        function updateContent(index) {
            const data = sectionData[index];
            
            mainImage.src = data.image;
            descTitle.textContent = data.title;
            descBody.textContent = data.text;
            counter.textContent = `${index + 1} / ${sectionData.length}`;
        }

        // Run initialization on load
        initMenu();
    </script>
</body>
</html>
