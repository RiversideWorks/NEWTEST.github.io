<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pop-Out Interactive Cutout Cards</title>
    <style>
        /* =========================================
           RESET & CANVAS BACKDROP (3D Grid)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ebebeb;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* Perspective Grid Background */
        .grid-backdrop {
            position: absolute;
            width: 200vw;
            height: 200vh;
            top: -50vh;
            left: -50vw;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.07) 1px, transparent 1px);
            transform: rotateX(40deg) scale(1.2);
            transform-origin: center center;
            pointer-events: none;
            z-index: 1;
        }

        /* =========================================
           HEADER TEXT
           ========================================= */
        .header {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-bottom: 40px;
        }

        .header p {
            font-size: 0.95rem;
            color: #333;
            font-weight: 500;
            line-height: 1.3;
        }

        .header .arrow {
            display: block;
            margin-top: 6px;
            font-size: 1.1rem;
            color: #555;
        }

        /* =========================================
           CARDS CONTAINER & LAYOUT
           ========================================= */
        .cards-container {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 24px;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            max-width: 900px;
            width: 100%;
        }

        /* Main Card Wrapper */
        .card-wrapper {
            perspective: 1000px;
            flex: 1;
            max-width: 380px;
        }

        .card {
            position: relative;
            background: #dedede;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 20px;
            padding: 12px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            overflow: visible; /* Allows subject to pop out top border */
        }

        /* Hover Radial Light/Glow (Tracks Cursor) */
        .card-glow {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: radial-gradient(circle 180px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.85), transparent 80%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 2;
        }

        .card:hover .card-glow {
            opacity: 1;
        }

        /* Image Stage Area */
        .card-image-stage {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 14px;
            overflow: visible; /* Allows cutout to break top boundary */
        }

        /* Clipped Background Image */
        .bg-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            overflow: hidden;
            z-index: 3;
        }

        .bg-layer img, .bg-layer svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Pop-Out Foreground Cutout Layer */
        .cutout-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            transform-origin: bottom center;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.15));
        }

        /* Hover Behavior: Cutout Pops Up & Out */
        .card:hover .cutout-layer {
            transform: translateY(-28px) scale(1.12);
            filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.3));
        }

        .cutout-layer svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* =========================================
           CARD CONTENT TYPOGRAPHY
           ========================================= */
        .card-body {
            position: relative;
            z-index: 5;
            padding: 14px 6px 6px 6px;
        }

        .card-body h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .card-body p {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.35;
        }

        /* Responsive Breakpoint */
        @media (max-width: 720px) {
            .cards-container {
                flex-direction: column;
                align-items: center;
                gap: 40px;
            }
            .card-wrapper {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Perspective Studio Backdrop Grid -->
    <div class="grid-backdrop"></div>

    <!-- Header -->
    <div class="header">
        <p>Hover your cursor<br>over the card.</p>
        <span class="arrow">↓</span>
    </div>

    <!-- Cards Section -->
    <div class="cards-container">

        <!-- CARD 1: Skateboarder -->
        <div class="card-wrapper">
            <div class="card">
                <div class="card-glow"></div>
                
                <div class="card-image-stage">
                    <!-- Background Layer (Clouds & Sky) -->
                    <div class="bg-layer">
                        <svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
                            <defs>
                                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#7ca0c7"/>
                                    <stop offset="40%" stop-color="#b2c8de"/>
                                    <stop offset="100%" stop-color="#d9cfc1"/>
                                </linearGradient>
                            </defs>
                            <rect width="400" height="280" fill="url(#skyGrad)"/>
                            <!-- Clouds -->
                            <path d="M 50,180 Q 80,140 130,160 Q 180,130 230,160 Q 270,140 320,170 Q 360,160 380,190 L 400,280 L 0,280 Z" fill="rgba(255,255,255,0.4)"/>
                            <path d="M 20,200 Q 70,170 120,190 Q 190,160 260,195 Q 310,180 370,210 L 400,280 L 0,280 Z" fill="rgba(255,255,255,0.6)"/>
                        </svg>
                    </div>

                    <!-- Cutout Layer (Skater - Extends Out on Hover) -->
                    <div class="cutout-layer">
                        <svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid meet">
                            <!-- Silhouette Vector Skateboarder -->
                            <g transform="translate(130, 30) scale(0.75)">
                                <!-- Skateboard -->
                                <path d="M 10 210 Q 70 230 130 180" stroke="#111" stroke-width="8" stroke-linecap="round" fill="none"/>
                                <circle cx="35" cy="212" r="6" fill="#444"/>
                                <circle cx="105" cy="190" r="6" fill="#444"/>
                                <!-- Skater Legs -->
                                <path d="M 45 160 L 35 205 M 95 135 L 110 180" stroke="#2b303a" stroke-width="16" stroke-linecap="round"/>
                                <!-- Torso -->
                                <path d="M 50 100 L 80 145" stroke="#222" stroke-width="22" stroke-linecap="round"/>
                                <!-- Arms -->
                                <path d="M 50 100 L 10 75 M 65 105 L 115 90" stroke="#222" stroke-width="10" stroke-linecap="round"/>
                                <!-- Head & Cap -->
                                <circle cx="45" cy="80" r="12" fill="#d0a880"/>
                                <path d="M 30 75 Q 45 65 60 78" stroke="#111" stroke-width="8" stroke-linecap="round"/>
                            </g>
                        </svg>
                    </div>
                </div>

                <div class="card-body">
                    <h3>Skateboarder</h3>
                    <p>Lorem ipsum dolor sit amet consectetur adipiscing elit</p>
                </div>
            </div>
        </div>

        <!-- CARD 2: Soda Can / Lorem Ipsum -->
        <div class="card-wrapper">
            <div class="card">
                <div class="card-glow"></div>
                
                <div class="card-image-stage">
                    <!-- Background Layer (Ocean & Rocks) -->
                    <div class="bg-layer">
                        <svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
                            <defs>
                                <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#a4c2c2"/>
                                    <stop offset="50%" stop-color="#5a8f91"/>
                                    <stop offset="100%" stop-color="#2c5e63"/>
                                </linearGradient>
                            </defs>
                            <rect width="400" height="280" fill="url(#seaGrad)"/>
                            <!-- Rocky Outcrop Right -->
                            <path d="M 280 280 L 290 160 L 330 130 L 400 150 L 400 280 Z" fill="#3a3835"/>
                            <path d="M 310 280 L 330 180 L 370 160 L 400 190 L 400 280 Z" fill="#262422"/>
                        </svg>
                    </div>

                    <!-- Cutout Layer (Floating Soda Can) -->
                    <div class="cutout-layer">
                        <svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid meet">
                            <!-- Floating Red Drink Can -->
                            <g transform="translate(180, 50) rotate(-12)">
                                <!-- Can Body -->
                                <rect x="0" y="20" width="55" height="100" rx="10" fill="#c02626"/>
                                <!-- Can Top Rim -->
                                <ellipse cx="27.5" cy="20" rx="27.5" ry="6" fill="#d1d5db"/>
                                <ellipse cx="27.5" cy="20" rx="22" ry="4" fill="#9ca3af"/>
                                <!-- Can Label Text/Graphic -->
                                <rect x="0" y="45" width="55" height="45" fill="#a11d1d"/>
                                <text x="27.5" y="72" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="sans-serif" transform="rotate(-90 27.5 72)">ESCUDO</text>
                                <!-- Can Highlight -->
                                <rect x="6" y="20" width="8" height="100" fill="rgba(255,255,255,0.25)"/>
                            </g>
                        </svg>
                    </div>
                </div>

                <div class="card-body">
                    <h3>Lorem Ipsum</h3>
                    <p>Lorem ipsum dolor sit amet consectetur adipiscing elit</p>
                </div>
            </div>
        </div>

    </div>

    <!-- =========================================
       INTERACTIVE TILT & LIGHT-TRACKING SCRIPT
       ========================================= -->
    <script>
        const cards = document.querySelectorAll('.card');

        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Calculate mouse percentage inside card for gradient light
                const mouseXPercent = (x / rect.width) * 100;
                const mouseYPercent = (y / rect.height) * 100;
                
                card.style.setProperty('--mouse-x', `${mouseXPercent}%`);
                card.style.setProperty('--mouse-y', `${mouseYPercent}%`);

                // 3D Perspective Tilt calculation
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -10;
                const rotateY = ((x - centerX) / centerX) * 10;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
            });
        });
    </script>
</body>
</html>
